version: '3.8'

services:
  ollama-proxy:
    build: .
    image: jjb000000/ollama-proxy:latest
    ports:
      - "5002:5002"
    networks:
      - default
      - nginx-network
    environment:
      - ANTIGRAVITY_API_KEYS=${ANTIGRAVITY_API_KEYS}
      - ANTIGRAVITY_PROXY_URL=http://antigravity-proxy:5010/v1
      - CLI_PROXY_API_KEYS=${CLI_PROXY_API_KEYS}
      - CLI_PROXY_API_BASE_URL=${CLI_PROXY_API_BASE_URL:-http://cli-proxy-api:8317/v1}
      - CLI_PROXY_API_PLUS_BASE_URL=${CLI_PROXY_API_PLUS_BASE_URL:-http://cli-proxy-api-plus:8317/v1}
      - CCS_API_KEYS=${CCS_API_KEYS}
      - CCS_API_BASE_URL=${CCS_API_BASE_URL:-http://ccs:20129/v1}
      - PROXY_API_TOKEN=${PROXY_API_TOKEN}
      - OLLAMA_API_KEYS=${OLLAMA_API_KEYS}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OPENCODE_API_KEYS=${OPENCODE_API_KEYS}
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-https://opencode.ai/zen/go/v1}
      - DEBUG_NDJSON_LOG=/debug-logs/debug-dfc5c9.log
    volumes:
      - /Users/jbj/Desktop/work/my/project/.cursor:/debug-logs
    restart: always
    container_name: ollama-proxy
    depends_on:
      - antigravity-proxy

  antigravity-proxy:
    build: ../antigravity-proxy
    image: jjb000000/antigravity-proxy:latest
    ports:
      - "5010:5010"
    environment:
      - PORT=5010
      - LOG_LEVEL=INFO
    volumes:
      - ~/.config/opencode:/root/.config/opencode
    restart: always
    container_name: antigravity-proxy

networks:
  nginx-network:
    external: true
